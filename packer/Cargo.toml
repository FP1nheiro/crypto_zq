[package]
name = "packer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "czq-pack"
path = "src/main.rs"

[dependencies]
crypto-core = { path = "../crypto-core" }
argon2 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2.workspace = true
clap = { version = "4", features = ["derive"] }
anyhow = "1"
